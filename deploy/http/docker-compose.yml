services:
  unimrcp:
    image: "unimrcp-http:20261012-8k16k"
    platform: linux/amd64
    container_name: unimrcp
    # Use the image already imported with docker load.
    pull_policy: never
    restart: unless-stopped
    # Linux host networking keeps SIP/SDP and RTP addresses consistent.
    network_mode: host
    stop_grace_period: 30s
    environment:
      TZ: Asia/Shanghai
      UNIMRCP_HTTP_ASR_URL: "http://127.0.0.1:5004/v1/asr/upload"
      UNIMRCP_HTTP_TTS_URL: "http://127.0.0.1:5005/api/v1/tts"
    volumes:
      - type: bind
        source: ./conf/unimrcpserver-http.xml
        target: /opt/unimrcp/conf/unimrcpserver.xml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./tts-audio
        target: /opt/unimrcp/var/tts
    # Override the test image's CMD; run the server in the foreground.
    command:
      - stdbuf
      - -oL
      - -eL
      - /opt/unimrcp/bin/unimrcpserver
      - -r
      - /opt/unimrcp
      - -w
      - -o
      - "1"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
