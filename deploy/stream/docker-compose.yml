services:
  unimrcp-stream:
    image: "unimrcp-http:20261012-8k16k"
    container_name: unimrcp-stream
    platform: linux/amd64
    pull_policy: never
    restart: unless-stopped
    network_mode: host
    stop_grace_period: 30s

    environment:
      TZ: Asia/Shanghai
      UNIMRCP_STREAM_ASR_URL: "ws://127.0.0.1:5004/v1/asr/stream"
      UNIMRCP_STREAM_TTS_URL: "http://127.0.0.1:5005/api/v1/tts/stream"

    volumes:
      - type: bind
        source: ./conf/unimrcpserver-http.xml
        target: /opt/unimrcp/conf/unimrcpserver.xml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./tts-audio
        target: /opt/unimrcp/var/tts

    command:
      - stdbuf
      - -oL
      - -eL
      - /opt/unimrcp/bin/unimrcpserver
      - -r
      - /opt/unimrcp
      - -w
      - -o
      - "1"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
